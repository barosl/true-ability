# GitLab Pages: publish every top-level file and folder (dotfiles excluded) as a static site.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir public
    - for f in *; do [ "$f" = public ] || cp -r "$f" public/; done
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
